name: CI-CD

on:
  push:

jobs:
  precommit:
    name: Pre-commit Check
    runs-on: ubuntu-22.04
    steps:
      # Setup
      - uses: AtomiCloud/actions.setup-nix@v1.2.1
        with:
          namespacelabs: "false"
      - uses: AtomiCloud/actions.cache-bun@v1.0.1
        with:
          namespacelabs: "false"
      # Action
      - name: Run pre-commit
        run: nix develop .#ci -c ./scripts/ci/pre-commit.sh
